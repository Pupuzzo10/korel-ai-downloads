name: Publish Korel Desktop 0.3.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-korel-v0.3.0.yml'
permissions:
  contents: write
jobs:
  verified-public-release:
    if: github.repository == 'Pupuzzo10/korel-ai-downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official verified binary package
        shell: bash
        env:
          ARTIFACT_DOWNLOAD_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-14c0-8246-bd7c-012e90c91bf6/raw?se=2026-10-11T23%3A15%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=48726f74-cfa2-50f7-8359-25d6cde9a22f&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A09%3A08Z&ske=2026-10-12T05%3A09%3A08Z&sks=b&skv=2026-02-06&sig=BWZ%2BQL9CFKpqb6rp7ZUXYCvDGX0x8OtUCV1trc2ibjg%3D'
        run: |
          set -euo pipefail
          mkdir -p release-files
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 180 "$ARTIFACT_DOWNLOAD_URL" -o /tmp/korel-release.zip
          unzip -q /tmp/korel-release.zip -d release-files
      - name: Validate EXACT expected files and cryptographic checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          for f in Korel-AI-Setup-0.3.0.exe Korel-AI-Setup-0.3.0.exe.blockmap latest.yml SHA256SUMS.txt GITHUB_RELEASE_NOTES.md; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import base64,hashlib,pathlib
          exe=pathlib.Path('Korel-AI-Setup-0.3.0.exe').read_bytes()
          manifest=pathlib.Path('latest.yml').read_text()
          assert 'version: 0.3.0' in manifest
          assert 'Korel-AI-Setup-0.3.0.exe' in manifest
          assert f'size: {len(exe)}' in manifest
          checksum=base64.b64encode(hashlib.sha512(exe).digest()).decode('ascii')
          assert f'sha512: {checksum}' in manifest
          assert hashlib.sha256(exe).hexdigest() == '56018990969f8f6f49bfd9a003e5e8de44e308eb8ffdf08978efc1aa71617f1f'
          print('Installer, blockmap, latest.yml and SHA512: VERIFIED')
          PY
      - name: Publish stable GitHub release for auto updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; do not overwrite.'
            exit 1
          fi
          gh release create v0.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Korel AI Desktop v0.3.0' \
            --notes-file release-files/GITHUB_RELEASE_NOTES.md \
            --latest \
            release-files/Korel-AI-Setup-0.3.0.exe \
            release-files/Korel-AI-Setup-0.3.0.exe.blockmap \
            release-files/latest.yml \
            release-files/SHA256SUMS.txt
      - name: Verify public release assets are complete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets
          printf '%s\n' Korel-AI-Setup-0.3.0.exe Korel-AI-Setup-0.3.0.exe.blockmap latest.yml SHA256SUMS.txt | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
